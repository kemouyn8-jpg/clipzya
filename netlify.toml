# Netlify configuration — Pixel Media landing page

# HTML pages: always revalidate at the edge, serve stale while revalidating (per Netlify speed-up template)
[[headers]]
  for = "/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

# One-year immutable caching is only for content-hashed static assets you
# actually generate (e.g. /assets/app.a1b2c3.js). If you add such files,
# uncomment and adapt this block:
#
# [[headers]]
#   for = "/assets/*"
#   [headers.values]
#     Cache-Control = "public, max-age=31536000, immutable"
